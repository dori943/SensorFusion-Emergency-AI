name: ✨ 기능 요청
description: 새로운 센서, 감지 로직, 기능을 제안합니다
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하고 싶은 문제
      description: 어떤 상황/한계 때문에 이 기능이 필요한가요?
      placeholder: 예) 현재는 낙상만 감지 가능한데, 가스 누출 상황도 감지하고 싶음
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
      placeholder: 사용할 센서, 알고리즘, 예상 토픽/메시지 구조 등
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 신규 센서 통합
        - 감지 알고리즘 개선
        - 알림/액추에이터 로직
        - 성능 최적화 (실시간성)
        - 기타
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 대안
      description: 다른 방법을 고려해봤다면 적어주세요
    validations:
      required: false
