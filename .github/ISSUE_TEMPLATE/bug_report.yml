name: 🐛 버그 리포트
description: 센서 퓨전 / 감지 로직 / ROS2 노드에서 발생한 문제를 신고합니다
title: "[Bug] "
labels: ["bug"]
body:
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      description: 응급 감지 정확도에 영향을 주는 버그인지 확인해주세요
      options:
        - Critical (오탐/미탐 등 감지 정확도에 직접 영향)
        - High (노드 크래시, 실시간성 저하)
        - Medium (일부 기능 오작동)
        - Low (로그, UI, 사소한 문제)
    validations:
      required: true

  - type: dropdown
    id: node
    attributes:
      label: 관련 노드 / 패키지
      options:
        - sensor_fusion_node
        - fall_detection_node
        - fire_smoke_detection_node
        - alert_publisher_node
        - launch / config
        - 기타
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: 발생한 문제
      description: 어떤 문제가 발생했는지 설명해주세요
      placeholder: 예) 사람이 쓰러진 상황에서도 fall_detection 토픽이 발행되지 않음
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 재현 방법
      placeholder: |
        1. ros2 launch ... 실행
        2. 특정 센서 조합(IMU+PIR) 상태에서
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 예상 동작
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: 환경 정보
      value: |
        - Hardware: Raspberry Pi 5 (RAM: )
        - OS: 
        - ROS2 Distro: 
        - Python: 
        - 센서 구성: 
      render: markdown
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 관련 로그 / ros2 topic echo 결과
      render: shell
    validations:
      required: false
