<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LiDAR Point Cloud</title>
    <style>
      html, body, canvas { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05080c; }
      #status { position: fixed; z-index: 2; top: 10px; left: 12px; color: #b9d7ee; font: 12px system-ui, sans-serif; }
      #alert-status { position: fixed; z-index: 2; top: 10px; right: 12px; color: #ffb34d; font: 700 13px system-ui, sans-serif; }
      #alert-status[data-state="2"] { color: #ff334f; }
      #view-controls {
        position: fixed;
        z-index: 2;
        left: 12px;
        bottom: max(12px, env(safe-area-inset-bottom));
        display: flex;
        gap: 6px;
        padding: 7px;
        border: 1px solid #29404f;
        border-radius: 10px;
        background: rgb(9 18 25 / 82%);
        color: #d9ebf5;
        font: 12px system-ui, sans-serif;
        backdrop-filter: blur(8px);
      }
      #view-controls label { display: flex; align-items: center; gap: 5px; padding: 3px 6px; }
      #view-controls input { accent-color: #ff8c00; }
    </style>
  </head>
  <body>
    <div id="status">0 points</div>
    <div id="alert-status" data-state="0"></div>
    <div id="view-controls" aria-label="화면 표시 설정">
      <label><input id="show-point-cloud" type="checkbox" checked /> 포클 보기</label>
      <label><input id="show-3d" type="checkbox" checked /> 3D 보기</label>
    </div>
    <!-- Pin this URL to the Three.js release used by the mobile app build. -->
    <script type="module" src="./renderer.js"></script>
  </body>
</html>
